<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happiest Birthday Bangaram 💗</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #ff9a9e, #900606, #d71da3, #a18cd1);
    overflow-x: hidden;
}

/* Floating Hearts */
.heart {
    position: fixed;
    bottom: -50px;
    font-size: 25px;
    animation: float 6s linear infinite;
    opacity: 0.8;
}

.heart:nth-child(1) {
    left: 10%;
    animation-delay: 1s;
}

.heart:nth-child(2) {
    left: 30%;
    animation-delay: 3s;
}

.heart:nth-child(3) {
    left: 55%;
    animation-delay: 2s;
}

.heart:nth-child(4) {
    left: 80%;
    animation-delay: 4s;
}

@keyframes float {
    0% {
        transform: translateY(0) rotate(0deg);
        opacity: 0;
    }

    20% {
        opacity: 1;
    }

    100% {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
    }
}

/* Card */
.card {
    width: 90%;
    max-width: 430px;
    padding: 25px;
    text-align: center;

    background: rgba(255,255,255,0.25);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);

    border: 2px solid rgba(255,255,255,0.5);
    border-radius: 30px;

    box-shadow: 0 15px 40px rgba(80,20,80,0.3);

    animation: cardPop 1.2s ease;
}

@keyframes cardPop {
    from {
        transform: scale(0.7);
        opacity: 0;
    }

    to {
        transform: scale(1);
        opacity: 1;
    }
}

/* Heading */
h1 {
    color: rgb(171, 19, 19);
    font-size: 30px;
    margin-bottom: 18px;
    text-shadow: 2px 3px 8px rgba(100,0,70,0.4);
}

/* Photo */
.photo {
    width: 210px;
    height: 210px;
    object-fit: cover;
    border-radius: 50%;

    border: 6px solid rgba(255,255,255,0.8);

    box-shadow: 0 8px 25px rgba(100,20,80,0.4);

    margin-bottom: 18px;
}

/* Video */
.birthday-video {
    width: 100%;
    max-width: 350px;
    margin: 10px auto 20px;

    display: block;

    border-radius: 20px;
    border: 3px solid rgba(244, 118, 118, 0.8);

    box-shadow: 0 8px 25px rgba(100,20,80,0.35);
}

/* Text */
.love {
    color: rgb(197, 46, 104);
    font-size: 25px;
    font-weight: bold;
    margin: 10px 0;
}

.message {
    color: rgb(187, 73, 73);
    font-size: 17px;
    line-height: 1.7;
}

.name {
    color: rgb(159, 43, 201);
    font-size: 25px;
    font-weight: bold;
    margin-top: 20px;
}

/* Button */
button {
    margin-top: 18px;
    padding: 12px 28px;

    border: none;
    border-radius: 30px;

    background: rgb(207, 24, 24);
    color: #d63384;

    font-size: 16px;
    font-weight: bold;

    cursor: pointer;

    box-shadow: 0 5px 15px rgba(100,20,80,0.25);

    transition: 0.3s;
}

button:hover {
    transform: scale(1.08);
}

@media(max-width:500px) {

    .card {
        padding: 20px;
    }

    h1 {
        font-size: 25px;
    }

    .photo {
        width: 180px;
        height: 180px;
    }

    .message {
        font-size: 15px;
    }
}
</style>
</head>

<body>

<!-- Floating Hearts -->
<div class="heart">💗</div>
<div class="heart">💖</div>
<div class="heart">💕</div>
<div class="heart">💞</div>


<div class="card">

    <h1>
        𝓗𝓪𝓹𝓹𝓲𝓮𝓼𝓽 𝓑𝓲𝓻𝓽𝓱𝓭𝓪𝔂 𝓑𝓪𝓷𝓰𝓪𝓻𝓪𝓶 💋
    </h1>


    <!-- Photo -->
    <img
        class="photo"
        src="https://i.ibb.co/5XdDKVMf/venky.jpg"
        alt="Birthday Photo"
    >



    <!-- Message -->
    <div class="love">
        Love nanaluuu 💗
    </div>

    <div class="message">
        Thank you so much nana<br>
        for being a best part in my life<br>
        bujjulu 💞
    </div>

    <div class="name">
        Venshi 🫂❣️
    </div>


</div>


<script>
  functio

</script>

</body>
</html>
